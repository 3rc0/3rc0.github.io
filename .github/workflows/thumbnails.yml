name: Generate certificate thumbnails

on:
  push:
    branches: [main]
    paths:
      - 'assets/data/certs/*.pdf'
      - 'assets/data/certs/*.docx'
      - 'assets/data/certs/*.doc'
      - 'assets/data/certs/*.pptx'
      - 'assets/data/certs/*.ppt'
      - 'assets/data/certs/*.xlsx'
      - 'assets/data/certs/*.xls'
  workflow_dispatch:

jobs:
  thumbnails:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install poppler-utils and LibreOffice
        run: sudo apt-get update && sudo apt-get install -y poppler-utils libreoffice

      - name: Convert Office documents to PDF
        run: |
          mkdir -p assets/data/certs/converted
          shopt -s nullglob
          for doc in assets/data/certs/*.docx assets/data/certs/*.doc assets/data/certs/*.pptx assets/data/certs/*.ppt assets/data/certs/*.xlsx assets/data/certs/*.xls; do
            base=$(basename "$doc")
            base="${base%.*}"
            out="assets/data/certs/converted/${base}.pdf"
            if [ -f "$out" ]; then
              echo "Already converted: $doc, skipping"
              continue
            fi
            echo "Converting $doc"
            if ! soffice --headless --convert-to pdf --outdir assets/data/certs/converted "$doc" 2>/dev/null; then
              echo "::warning::LibreOffice conversion failed for $doc, leaving it unsupported"
            fi
          done

      - name: Generate missing thumbnails
        run: |
          mkdir -p assets/data/certs/thumbs
          shopt -s nullglob
          for pdf in assets/data/certs/*.pdf assets/data/certs/converted/*.pdf; do
            base=$(basename "$pdf" .pdf)
            thumb="assets/data/certs/thumbs/${base}-thumb.jpg"
            if [ -f "$thumb" ]; then
              echo "Already have a thumbnail for $pdf, skipping"
              continue
            fi
            echo "Generating thumbnail for $pdf"
            if pdftoppm -jpeg -r 80 -f 1 -l 1 -scale-to 600 "$pdf" "assets/data/certs/thumbs/${base}-thumb" 2>/dev/null; then
              if [ -f "assets/data/certs/thumbs/${base}-thumb-1.jpg" ]; then
                mv "assets/data/certs/thumbs/${base}-thumb-1.jpg" "$thumb"
              else
                echo "::warning::pdftoppm ran but no output found for $pdf"
              fi
            else
              echo "::warning::pdftoppm failed for $pdf, leaving it on the icon fallback"
            fi
          done

      - name: Determine which patterns have files
        id: patterns
        run: |
          patterns=""
          if ls assets/data/certs/thumbs/*.jpg >/dev/null 2>&1; then
            patterns="assets/data/certs/thumbs/*.jpg"
          fi
          if ls assets/data/certs/converted/*.pdf >/dev/null 2>&1; then
            patterns="$patterns assets/data/certs/converted/*.pdf"
          fi
          echo "patterns=$patterns" >> "$GITHUB_OUTPUT"

      - name: Commit generated files
        if: steps.patterns.outputs.patterns != ''
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "Auto-generate certificate thumbnails and conversions"
          file_pattern: ${{ steps.patterns.outputs.patterns }}
          commit_user_name: github-actions[bot]
          commit_user_email: github-actions[bot]@users.noreply.github.com